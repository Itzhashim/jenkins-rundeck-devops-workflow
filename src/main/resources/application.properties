# Application Configuration
spring.application.name=devops-demo-app
server.port=8080

# Expose Spring Actuator Endpoints for health and metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Custom Application Metadata
app.name=DevOps Demo Application
app.version=1.0.0
app.environment=production
app.description=Automated CI/CD with Jenkins and Operations with Rundeck
